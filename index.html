<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="استمارة طلب فيديو: احكي لنا عن الفيديو اللي محتاجه في ٥ دقايق. Video request form.">
<meta property="og:title" content="بريف الفيديو | Video Brief">
<meta property="og:description" content="احكي لنا عن الفيديو اللي محتاجه في ٥ دقايق.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Video Brief</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Readex+Pro:wght@300..700&display=swap">
<style>
/* Layout: a studio desk. A timeline of colour-labelled clips (one per step) on top, the current step as one card,
   and a live "monitor" beside it that builds the video as the client answers. Each step keeps its clip colour. */
:root{
  --bg:#F5F4FA; --surface:#FFFFFF; --sunk:#F0EEF7; --ink:#1A1730; --muted:#67637F; --line:#E4E1EF;
  --brand:#F2512F; --brand-ink:#FFFFFF; --brand-soft:#FFE9E3;
  --sky:#2C86E8; --sky-soft:#E3EFFD; --coral:#F2512F; --coral-soft:#FFE9E3; --mint:#0C9A6F; --mint-soft:#DDF5EB;
  --iris:#6A4FEA; --iris-soft:#ECE8FE; --rose:#DE3F86; --rose-soft:#FCE5EF; --sun:#F2A100; --sun-soft:#FFF1D2;
  --on:#FFFFFF; --on-sun:#1A1730;
  --warn:#A94E06; --warn-soft:#FFF0DE; --ok:#0B8257; --ok-soft:#DDF5EB;
  --monitor:#15131F; --monitor-ink:#EFEDF8; --monitor-dim:#8E8AA8;
  --shadow:0 1px 2px rgba(26,23,48,.04),0 10px 30px -14px rgba(26,23,48,.18);
  --f-display:"Bricolage Grotesque","Alexandria","Readex Pro",system-ui,sans-serif;
  --f-body:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#100F18; --surface:#1A1926; --sunk:#14131E; --ink:#F1EFFA; --muted:#A29EBB; --line:#2D2B40;
  --brand:#FF7253; --brand-ink:#14121D; --brand-soft:#3A1F19;
  --sky:#64B0FF; --sky-soft:#13263C; --coral:#FF7253; --coral-soft:#3A1F19; --mint:#3DD3A0; --mint-soft:#0F2D24;
  --iris:#A08CFF; --iris-soft:#251F46; --rose:#FF7DB2; --rose-soft:#3A1729; --sun:#FFC23D; --sun-soft:#352A0E;
  --on:#14121D; --on-sun:#14121D;
  --warn:#FFB066; --warn-soft:#33220F; --ok:#5CD6A6; --ok-soft:#0F2D24;
  --monitor:#0A0910; --monitor-ink:#EFEDF8; --monitor-dim:#7F7B98;
  --shadow:0 1px 0 rgba(255,255,255,.03); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#100F18; --surface:#1A1926; --sunk:#14131E; --ink:#F1EFFA; --muted:#A29EBB; --line:#2D2B40;
  --brand:#FF7253; --brand-ink:#14121D; --brand-soft:#3A1F19;
  --sky:#64B0FF; --sky-soft:#13263C; --coral:#FF7253; --coral-soft:#3A1F19; --mint:#3DD3A0; --mint-soft:#0F2D24;
  --iris:#A08CFF; --iris-soft:#251F46; --rose:#FF7DB2; --rose-soft:#3A1729; --sun:#FFC23D; --sun-soft:#352A0E;
  --on:#14121D; --on-sun:#14121D;
  --warn:#FFB066; --warn-soft:#33220F; --ok:#5CD6A6; --ok-soft:#0F2D24;
  --monitor:#0A0910; --monitor-ink:#EFEDF8; --monitor-dim:#7F7B98;
  --shadow:0 1px 0 rgba(255,255,255,.03); color-scheme:dark;
}
.tone-sky{--c:var(--sky);--cs:var(--sky-soft);--co:var(--on)}
.tone-coral{--c:var(--coral);--cs:var(--coral-soft);--co:var(--on)}
.tone-mint{--c:var(--mint);--cs:var(--mint-soft);--co:var(--on)}
.tone-iris{--c:var(--iris);--cs:var(--iris-soft);--co:var(--on)}
.tone-rose{--c:var(--rose);--cs:var(--rose-soft);--co:var(--on)}
.tone-sun{--c:var(--sun);--cs:var(--sun-soft);--co:var(--on-sun)}
.tone-brand{--c:var(--brand);--cs:var(--brand-soft);--co:var(--brand-ink)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 40px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--c, var(--brand));outline-offset:2px}
.wrap{max-width:1140px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;text-wrap:balance}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{letter-spacing:0}

/* Header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mark{width:40px;height:40px;flex:none;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.brand .mark svg{width:28px;height:28px}
.brand b{display:block;font-family:var(--f-display);font-size:18px;line-height:1.15;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:12.5px;letter-spacing:.02em}
.lang{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;color:var(--muted);font-weight:500}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Tabs (Claude version only) */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;cursor:pointer;font-weight:500;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .count{font-size:12px;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:0 7px;min-width:20px;text-align:center}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px clamp(20px,4vw,40px);margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.hero h1{font-size:clamp(28px,4.4vw,44px);line-height:1.12;margin:6px 0 10px;font-weight:800}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p{color:var(--muted);margin:0;max-width:56ch;font-size:15.5px}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
html[dir="rtl"] .eyebrow{letter-spacing:0;text-transform:none;font-size:13px}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.facts span{background:var(--sunk);border-radius:999px;padding:6px 13px;font-size:13.5px;color:var(--muted)}
.facts b{color:var(--ink);font-family:var(--f-display);font-weight:800;margin-inline-end:4px}
.hero-art svg{width:clamp(120px,16vw,170px);height:auto;display:block}
.clap-arm{transform-origin:14px 36px;transform:rotate(-16deg);transition:transform .2s}
.hero:hover .clap-arm{animation:clapOnce .7s ease}
@keyframes clapOnce{0%{transform:rotate(-16deg)}45%{transform:rotate(0)}60%{transform:rotate(-5deg)}100%{transform:rotate(-16deg)}}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero-art{display:none}}

/* Timeline of steps */
.tl{display:flex;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:7px;margin-bottom:16px;box-shadow:var(--shadow)}
.clip{flex:1 1 0;min-width:0;height:42px;border:0;border-radius:8px;background:var(--sunk);color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:7px;padding-inline:10px;font-size:13px;font-weight:600;position:relative;overflow:hidden;text-align:start;transition:background .2s,color .2s,flex-grow .3s}
.clip::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--c)}
.clip .n{font-family:var(--f-display);font-weight:800;flex:none}
.clip .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .ok{margin-inline-start:auto;flex:none;width:16px;height:16px;border-radius:50%;background:var(--c);display:grid;place-items:center}
.clip .ok::after{content:"";width:6px;height:3px;border:2px solid var(--co);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.clip.done{background:var(--cs);color:var(--ink)}
.clip[aria-current="step"]{background:var(--c);color:var(--co);flex-grow:1.6}
.clip[aria-current="step"] .ok{background:var(--co)} .clip[aria-current="step"] .ok::after{border-color:var(--c)}
.clip.rev{flex:0 0 auto}
@media (max-width:720px){.clip:not([aria-current="step"]) .lbl,.clip:not([aria-current="step"]) .ok{display:none}.clip{justify-content:center;padding-inline:6px}.clip[aria-current="step"]{flex-grow:4;justify-content:flex-start}}

/* Studio: card + monitor */
.studio{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
@media (max-width:920px){.studio{grid-template-columns:minmax(0,1fr)}.pv{order:-1}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px clamp(18px,3.4vw,36px);min-width:0;box-shadow:var(--shadow)}
.step-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.step-top .eyebrow{color:var(--c)}
.tc{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:2px 8px;direction:ltr;font-variant-numeric:tabular-nums}
.card h2{font-size:clamp(24px,3vw,30px);margin:6px 0 4px;font-weight:800;line-height:1.2}
.step-sub{color:var(--muted);margin:0 0 6px;max-width:62ch}

.q{display:flex;flex-direction:column;gap:10px;padding-block:20px;border-top:1px dashed var(--line);min-width:0}
.q .ql{font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q .hint{color:var(--muted);font-size:13.5px;margin-top:-6px}
.q .multi{color:var(--muted);font-size:12.5px;margin-top:-6px;display:flex;align-items:center;gap:6px}
.q .multi::before{content:"";width:12px;height:8px;border:1.5px solid currentColor;border-radius:3px;box-shadow:3px -3px 0 -1.5px var(--surface),3px -3px 0 0 currentColor;opacity:.8}
.need{font-size:11.5px;font-weight:600;color:var(--c);background:var(--cs);padding:1px 9px;border-radius:999px}
.q.sub{border-top:0;margin-inline-start:6px;padding:12px 0 14px;padding-inline-start:18px;border-inline-start:3px solid var(--cs);position:relative}
.q.sub .ql{font-size:14.5px}
.q.sub::before{content:"";position:absolute;inset-inline-start:-7.5px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--c)}
.q.enter{animation:rise .38s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

input[type=text],input[type=date],textarea{width:100%;background:var(--sunk);border:1.5px solid transparent;border-radius:12px;padding:11px 14px;outline:none;transition:border-color .15s,background .15s}
input[type=text]:hover,textarea:hover{border-color:var(--line)}
input[type=text]:focus,input[type=date]:focus,textarea:focus{border-color:var(--c);background:var(--surface)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
textarea{min-height:100px;resize:vertical}
textarea.tall{min-height:150px}
input.ltr{direction:ltr;text-align:start}
html[dir="rtl"] input.ltr{text-align:right}
.q.invalid input,.q.invalid textarea{border-color:var(--warn)}
.err{color:var(--warn);font-size:13px;font-weight:600}

.help{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.help:empty{display:none}
.help.warn{color:var(--warn)} .help.good{color:var(--ok)}
.help b{font-weight:600}
.linkbtn{border:0;background:none;color:var(--c);font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);padding:8px 15px;border-radius:999px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;font-size:14.5px}
.chip:hover{border-color:var(--c)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{border-color:var(--c);background:var(--cs)}
.chip .tick{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;transition:background .15s}
.chip[aria-pressed="true"] .tick{background:var(--c);border-color:var(--c)}
.chip[aria-pressed="true"] .tick::after{content:"";width:7px;height:3.5px;border:2px solid var(--co);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.chip.unsure{border-style:dashed}
.chip .shape{display:inline-block;border:1.5px solid currentColor;border-radius:2.5px;opacity:.7}
.chip .bar{display:inline-block;height:6px;border-radius:3px;background:var(--c);opacity:.55}
.chip .badge{font-size:11px;font-weight:600;background:var(--c);color:var(--co);border-radius:999px;padding:0 7px;line-height:1.7}
.pop .tick{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.other-in{margin-top:2px}

/* Option cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.ocard{display:flex;flex-direction:column;gap:5px;text-align:start;border:1.5px solid var(--line);background:var(--surface);padding:12px;border-radius:16px;cursor:pointer;position:relative;transition:border-color .15s,background .15s,transform .12s}
.ocard:hover{border-color:var(--c);transform:translateY(-2px)}
.ocard[aria-pressed="true"]{border-color:var(--c);background:var(--cs)}
.ocard svg{width:100%;height:auto;aspect-ratio:5/3;border-radius:10px;background:var(--sunk);color:var(--muted);margin-bottom:4px}
.ocard[aria-pressed="true"] svg{background:var(--surface);color:var(--ink)}
.ocard svg .ac{fill:var(--c)}
.ocard b{font-size:14.5px;font-weight:600} .ocard small{color:var(--muted);font-size:12.5px;line-height:1.45}
.ocard .tick{position:absolute;top:10px;inset-inline-end:10px;width:22px;height:22px;border-radius:50%;background:var(--c);display:none;place-items:center}
.ocard[aria-pressed="true"] .tick{display:grid}
.ocard .tick::after{content:"";width:8px;height:4px;border:2px solid var(--co);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ocard.unsure{border-style:dashed}

/* Sizes per platform */
.plats{display:flex;flex-direction:column;gap:2px;background:var(--sunk);border-radius:14px;padding:4px 14px}
.plat{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;padding-block:10px;border-top:1px dashed var(--line)}
.plat:first-child{border-top:0}
.plat > b{font-size:14px;font-weight:600}
.plat .chip{background:var(--surface);font-size:13.5px;padding:6px 12px}
.plat .chip[aria-pressed="true"]{background:var(--cs)}
.plat .chip .r{direction:ltr;font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:560px){.plat{grid-template-columns:1fr;gap:6px}}

/* Hashtags */
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--sunk);border:1.5px solid transparent;border-radius:12px;padding:7px 8px;cursor:text}
.tags:focus-within{border-color:var(--c);background:var(--surface)}
.tagchip{display:inline-flex;align-items:center;gap:2px;background:var(--cs);border-radius:999px;padding:3px 4px 3px 11px;font-size:14px;direction:ltr}
.tagchip button{border:0;background:none;cursor:pointer;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:15px;line-height:1}
.tagchip button:hover{background:var(--surface);color:var(--ink)}
.tags input{flex:1;min-width:150px;border:0!important;background:transparent!important;padding:5px 6px!important}

/* Assets */
.assets{display:flex;flex-direction:column;gap:8px}
.asset{display:grid;grid-template-columns:150px minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--sunk);border-radius:14px;padding:8px 8px 8px 12px}
html[dir="rtl"] .asset{padding:8px 12px 8px 8px}
.asset > b{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.asset > b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.asset input[type=text]{background:var(--surface);padding:9px 12px}
.asset .x{border:0;background:none;cursor:pointer;width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:18px}
.asset .x:hover{background:var(--surface);color:var(--ink)}
.asset .spacer{width:32px}
.addrow{align-self:flex-start;border:1.5px dashed var(--c);background:none;color:var(--c);border-radius:999px;padding:7px 15px;font-weight:600;cursor:pointer}
.addrow:hover{background:var(--cs)}
@media (max-width:640px){.asset{grid-template-columns:minmax(0,1fr) auto}.asset > b{grid-column:1}.asset .x,.asset .spacer{grid-column:2;grid-row:1}.asset input{grid-column:1/-1}}

/* Nav */
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface);padding:10px 20px;border-radius:999px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform .1s,filter .15s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.97)}
.btn.next{background:var(--c);color:var(--co);border-color:var(--c)}
.btn.next:hover,.btn.go:hover{filter:brightness(1.06)}
.btn.go{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 13px;font-size:13px}
.arr{display:inline-block} html[dir="rtl"] .arr{transform:scaleX(-1)}
.saved{font-size:12.5px;color:var(--muted)}

/* Monitor (live preview) */
.pv{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);min-width:0}
.pv-toggle{display:none;width:100%;border:0;background:none;padding:12px 16px;cursor:pointer;align-items:center;gap:10px;font-weight:600;text-align:start}
.pv-toggle .mini{display:flex;gap:4px;align-items:center;margin-inline-start:auto}
.pv-toggle .mini i{display:block;border:1.5px solid var(--ink);border-radius:2px;opacity:.6}
.pv-toggle .chev{transition:transform .2s}
.pv.open .pv-toggle .chev{transform:rotate(180deg)}
@media (max-width:920px){.pv{position:static}.pv-toggle{display:flex}.pv:not(.open) .pv-body{display:none}}
.mon{background:var(--monitor);color:var(--monitor-ink);aspect-ratio:16/11;position:relative;display:grid;place-items:center;padding:30px 16px 38px;overflow:hidden}
.mon .rec{position:absolute;top:11px;inset-inline-start:13px;font-size:11px;letter-spacing:.08em;display:flex;align-items:center;gap:6px;color:var(--monitor-dim);font-family:ui-monospace,"SF Mono",Menlo,monospace;direction:ltr}
.mon .rec::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand);animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.mon .tcode{position:absolute;top:11px;inset-inline-end:13px;font-size:11px;color:var(--monitor-dim);font-family:ui-monospace,"SF Mono",Menlo,monospace;direction:ltr}
.mon .ttl{position:absolute;bottom:11px;inset-inline:14px;font-family:var(--f-display);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.mon .ttl.ph{color:var(--monitor-dim);font-weight:500}
.frames{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:100%}
.frames .fr{border:1.5px solid var(--monitor-ink);border-radius:4px;display:grid;place-items:center;font-size:10.5px;color:var(--monitor-ink);direction:ltr;font-variant-numeric:tabular-nums}
.mon .empty{color:var(--monitor-dim);font-size:13px;text-align:center;max-width:24ch}
.pv dl{margin:0;padding:6px 18px 4px;display:flex;flex-direction:column}
.pv .row2{display:grid;grid-template-columns:74px minmax(0,1fr);gap:10px;padding-block:9px;border-top:1px dashed var(--line);font-size:13.5px}
.pv .row2:first-child{border-top:0}
.pv dt{color:var(--muted)}
.pv dd{margin:0;overflow-wrap:anywhere}
.pv dd.none{color:var(--muted);opacity:.6}
.pv .dur{display:flex;align-items:center;gap:8px}
.pv .dur i{display:block;height:6px;border-radius:3px;background:var(--brand)}
.meter{padding:12px 18px 16px;border-top:1px solid var(--line)}
.meter .track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter .fill{height:100%;background:linear-gradient(90deg,var(--sky),var(--iris),var(--rose),var(--brand),var(--sun));border-radius:99px;transition:width .4s ease}
html[dir="rtl"] .meter .fill{background:linear-gradient(-90deg,var(--sky),var(--iris),var(--rose),var(--brand),var(--sun))}
.meter .q2{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:7px}
.meter .q2 b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Review sheet */
.sheet{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:14px}
.sheet .sec{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 18px;padding:16px;border-top:1px solid var(--line);position:relative}
.sheet .sec:first-child{border-top:0}
.sheet .sec::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--c)}
.sheet .sec h4{margin:0 0 4px;font-size:14px;font-family:var(--f-display);font-weight:700}
.sheet dl{margin:0;display:grid;grid-template-columns:minmax(110px,max-content) minmax(0,1fr);gap:7px 16px}
.sheet dt{color:var(--muted);font-size:13.5px}
.sheet dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.sheet .edit{border:0;background:none;color:var(--c);cursor:pointer;font-size:13px;padding:0;font-weight:600}
.sheet .nothing{color:var(--muted);font-size:13.5px}
@media (max-width:620px){.sheet .sec{grid-template-columns:1fr}.sheet dl{grid-template-columns:1fr;gap:2px}.sheet dt{font-weight:600;margin-top:6px}}
.sheet .frames{justify-content:flex-start}
.sheet .frames .fr{border-color:var(--ink);color:var(--muted)}

.note{border-radius:14px;padding:12px 15px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.info{background:var(--sunk);color:var(--ink)}
.note ul{margin:4px 0 0;padding-inline-start:18px}
.note .linkbtn{color:inherit}
.mb{margin-bottom:12px}
.mailbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mailbox .addr{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 9px;user-select:all;direction:ltr}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

/* Sent */
.sent{text-align:center;padding:36px 12px 26px}
.sent svg{width:150px;height:auto;margin:0 auto 6px;display:block}
.sent .clap-arm{animation:clapShut .8s .25s cubic-bezier(.5,0,.3,1.4) both}
@keyframes clapShut{from{transform:rotate(-24deg)}to{transform:rotate(0)}}
.sent .action{font-family:var(--f-display);font-weight:800;color:var(--brand);font-size:15px;letter-spacing:.12em;animation:rise .4s .9s both}
html[dir="rtl"] .sent .action{letter-spacing:0;font-size:17px}
.sent h2{margin:4px 0 8px}
.sent p{color:var(--muted);max-width:48ch;margin:0 auto 10px}

/* Lists (Claude version) */
.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.item.focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.item-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.item-h h3{margin:0;font-size:17px}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--sunk);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.s-new::before{background:var(--sky)} .pill.s-changes::before{background:var(--warn)}
.pill.s-treatment{background:var(--brand-soft)} .pill.s-treatment::before{background:var(--brand)}
.pill.s-production::before,.pill.s-delivered::before{background:var(--ok)}
.reply{margin-top:14px;border-inline-start:3px solid var(--brand);padding-block:4px;padding-inline:14px 0;display:flex;flex-direction:column;gap:10px}
.reply h4{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.reply .body{white-space:pre-wrap;overflow-wrap:anywhere}
details.more{margin-top:12px} details.more summary{cursor:pointer;color:var(--brand);font-weight:600;font-size:14px}
.emptybox{border:1.5px dashed var(--line);border-radius:16px;padding:30px;text-align:center;color:var(--muted)}
select.status{width:auto;padding:6px 10px;font-size:13px;border-radius:10px;border:1px solid var(--line);background:var(--sunk)}

.foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:26px}
.foot b{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function optOf(q,k){return (q.opts||[]).find(o=>o[0]===k)}

function sizeName(p,k,lg){const s=(PLAT[p]||[]).find(x=>x[0]===k);return s?(lg==="ar"?s[1]:s[2]):""}
const ratio = k => k.replace("x",":");
function uniqueSizes(ans){const out=[];const sz=ans.sizes||{};arr(ans.platforms).forEach(p=>arr(sz[p]).forEach(k=>{if(!out.includes(k))out.push(k)}));return out}
function valueText(q,v,lg,ans){
 lg=lg||lang; ans=ans||A; const sep=lg==="ar"?"، ":", ";
 const ol=k=>{if(k==="other"){const x=ans[q.id+"_other"];return T[lg].otherLabel+(x?": "+x:"")}const o=optOf(q,k);return o?(lg==="ar"?o[1]:o[2]):k};
 if(q.type==="sizes"){
  const sz=v||{};
  return arr(ans.platforms).filter(p=>arr(sz[p]).length).map(p=>platName(p,lg)+": "+arr(sz[p]).map(k=>ratio(k)+" ("+sizeName(p,k,lg)+")").join(sep)).join("\n");
 }
 if(q.type==="tags") return arr(v).map(x=>"#"+x).join(" ");
 if(q.kind==="assets"){
  const lines=[];
  arr(v).forEach(k=>{
   if(k==="none"){lines.push(ol(k));return}
   const link=(ans["al_"+k]||"").trim(), note=(ans["an_"+k]||"").trim();
   lines.push("• "+ol(k)+(link?" — "+link:"")+(note?" ("+note+")":""));
  });
  arr(ans.extra).forEach(x=>{if(!x)return;const nm=(x.name||"").trim(),lk=(x.link||"").trim(),nt=(x.note||"").trim();if(nm||lk||nt)lines.push("• "+(nm||T[lg].otherLabel)+(lk?" — "+lk:"")+(nt?" ("+nt+")":""))});
  return lines.join("\n");
 }
 if(isEmpty(v))return "";
 if(q.type==="multi"||q.type==="cards"||q.type==="chips")return arr(v).map(ol).join(sep);
 if(q.type==="date"){try{return new Date(v+"T00:00:00").toLocaleDateString(lg==="ar"?"ar-EG":"en-AU",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}catch(e){return v}}
 return String(v).trim();
}
function isEmpty(v){
 if(v==null||v==="")return true;
 if(Array.isArray(v))return !v.filter(Boolean).length;
 if(typeof v==="object")return !Object.values(v).some(x=>!isEmpty(x));
 return !String(v).trim();
}

 }

const TYPO = {"gmial.com":"gmail.com","gamil.com":"gmail.com","gmai.com":"gmail.com","gmail.co":"gmail.com","gmal.com":"gmail.com","gmail.cm":"gmail.com","hotmial.com":"hotmail.com","hotmai.com":"hotmail.com","yaho.com":"yahoo.com","yahooo.com":"yahoo.com","outlok.com":"outlook.com","outllok.com":"outlook.com","iclod.com":"icloud.com"};
function mailFix(v){
 const m=/^([^@\s]+)@([^@\s]+)$/.exec((v||"").trim()); if(!m)return "";
 let d=m[2].toLowerCase(), fixed=TYPO[d]||d;
 fixed=fixed.replace(/\.(con|cmo|ocm|comm|om|vom|xom)$/,".com");
 return fixed!==d?m[1]+"@"+fixed:"";
}
function scriptSecs(txt){
 const s=(txt||"").trim(); if(!s)return 0;
 const words=s.split(/\s+/).length; const ar=/[؀-ۿ]/.test(s);
 return Math.max(1,Math.round(words/(ar?2.2:2.5)));
}
function helpHTML(q){
 const v=A[q.id]||"";
 if(q.help==="contact"){const f=mailFix(v);return f?`<span class="warn" style="color:var(--warn)">${t("typo")(esc(f))}</span>`:""}
 if(q.help==="script"){
  const s=scriptSecs(v); if(!s)return "";
  const max=DUR_MAX[A.duration]; const dq=QIDX.duration.q;
  let out=`⏱ <span>${t("scriptTime")(num(s))}</span>`;
  if(max&&A.duration!=="90+"){out+=s>max+3?` <span style="color:var(--warn)">${t("scriptLong")(esc(valueText(dq,A.duration)))}</span>`:` <span style="color:var(--ok)">${t("scriptFits")}</span>`}
  return out;
 }
 if(q.help==="caption"){
  const n=[...v].length; if(!n)return `💡 ${t("capTip")}`;
  let out=`<b>${t("capCount")(num(n))}</b> · <span>${t("capTip")}</span>`;
  if(has(A,"platforms","x")&&n>280) out+=` <span style="color:var(--warn)">${t("capX")}</span>`;
  return out;
 }
 if(q.help==="date"){
  if(!v)return "";
  const d=new Date(v+"T00:00:00"), today=new Date(); today.setHours(0,0,0,0);
  const days=Math.round((d-today)/864e5);
  if(days<0)return `<span style="color:var(--warn)">${t("datePast")}</span>`;
  if(days<4)return `<span style="color:var(--warn)">⚡ ${t("dateSoon")}</span>`;
  return "";
 }

function pvInner(){

 const row=(lab,html)=>`<div class="row2"><dt>${lab}</dt><dd${html?"":' class="none"'}>${html||"—"}</dd></div>`;
 const vt=id=>esc(valueText(QIDX[id].q,A[id]));
 let voice="";
 if(A.vo==="yes"){const bits=[valueText(QIDX.vo_gender.q,A.vo_gender),qVisible(QIDX.vo_dialect.q,A)?valueText(QIDX.vo_dialect.q,A.vo_dialect):""].filter(Boolean);voice=t("pvVo")+(bits.length?" · "+bits.join(" · "):"")}
 else if(A.vo==="no") voice=t("pvNoVo");
 const dur=A.duration&&A.duration!=="unsure"?`<span class="dur"><i style="width:${Math.round(({"6-15":15,"15-30":30,"30-60":60,"60-90":90,"90+":120}[A.duration])/120*60)+8}px"></i>${vt("duration")}</span>`:vt("duration");
 const when=A.deadline==="date"&&A.deadline_date?esc(valueText(QIDX.deadline_date.q,A.deadline_date)):vt("deadline");
 // progress over every visible question
 let tot=0,done=0; vSteps(A).forEach(s=>vQs(s,A).forEach(q=>{tot++;if(answered(q,A))done++}));
 const p=tot?Math.round(done/tot*100):0; const quip=t("quips")[p<15?0:p<45?1:p<80?2:3];
 const mini=fr.slice(0,4).map(k=>{const [w,h]=k.split("x").map(Number);const sc=14/Math.max(w,h);return `<i style="width:${Math.round(w*sc)}px;height:${Math.round(h*sc)}px"></i>`}).join("");
 return `<button type="button" class="pv-toggle" data-act="pv" aria-expanded="${pvOpen}"><span>${t("pvOpen")} · ${t("pct")(num(p))}</span><span class="mini">${mini}</span><span class="chev">▾</span></button>
 <div class="pv-body"><div class="mon"><span class="rec">REC</span><span class="tcode">${esc(A.duration&&A.duration!=="unsure"?A.duration.replace("-","–")+"s":"--:--")}</span>${frames}<div class="ttl${A.title?"":" ph"}">${esc(A.title||t("pvUntitled"))}</div></div>
 <dl>${row(t("pvType"),vt("type"))}${row(t("pvLen"),dur)}${row(t("pvStyle"),vt("style"))}${row(t("pvVoice"),esc(voice))}${row(t("pvWhere"),vt("platforms"))}${row(t("pvWhen"),when)}</dl>

}

 const inp=e.target.closest(".tag-in"); if(!inp)return;
 const box=inp.closest("[data-tagbox]");
 if(e.key==="Enter"||e.key===","||e.key==="،"||(e.key===" "&&inp.value.trim())){e.preventDefault();if(addTag(box,inp.value))tagsChanged(box.dataset.tagbox,true)}
 else if(e.key==="Backspace"&&!inp.value&&arr(A[box.dataset.tagbox]).length){A[box.dataset.tagbox]=arr(A[box.dataset.tagbox]).slice(0,-1);saveDraft();tagsChanged(box.dataset.tagbox,true)}
});
document.addEventListener("focusout",e=>{
 const inp=e.target.closest&&e.target.closest(".tag-in"); if(!inp||!inp.value.trim())return;
 const box=inp.closest("[data-tagbox]"); if(addTag(box,inp.value)){const id=box.dataset.tagbox;setTimeout(()=>tagsChanged(id,false),0)}
});
document.addEventListener("paste",e=>{
 const inp=e.target.closest&&e.target.closest(".tag-in"); if(!inp)return;
 const txt=(e.clipboardData||window.clipboardData)?.getData("text")||""; if(!/[\s,#]/.test(txt))return;
 e.preventDefault(); const box=inp.closest("[data-tagbox]"); if(addTag(box,inp.value+" "+txt))tagsChanged(box.dataset.tagbox,true)
});
document.addEventListener("click",async e=>{
 const tb=e.target.closest("[data-tagbox]");
 const rm=e.target.closest("[data-tagrm]");
 if(rm){const box=rm.closest("[data-tagbox]");const id=box.dataset.tagbox;const l=arr(A[id]).slice();l.splice(+rm.dataset.tagrm,1);A[id]=l;saveDraft();tagsChanged(id,true);return}
 if(tb&&e.target===tb){tb.querySelector("input")?.focus();return}
 const opt=e.target.closest("[data-opt]");
 if(opt){
  const id=opt.dataset.opt,k=opt.dataset.k,multi=opt.dataset.m==="1";
  if(multi){
   let a=arr(A[id]).slice();
   const exclusive=k==="unsure"||k==="none";
   if(a.includes(k))a=a.filter(x=>x!==k);
   else{ if(exclusive)a=[k]; else a=a.filter(x=>x!=="unsure"&&x!=="none").concat(k); }
   A[id]=a;
  }else A[id]=A[id]===k?"":k;
  linkAnswers(id,k);
  saveDraft();
  refresh(`[data-opt="${id}"][data-k="${k}"]`);
  if(k==="other"&&arr(A[id]).includes("other"))document.getElementById("f-"+id+"_other")?.focus();
  return;
 }
 const sz=e.target.closest("[data-size]");
 if(sz){
  const p=sz.dataset.size,k=sz.dataset.k; const s=Object.assign({},A.sizes||{}); let l=arr(s[p]).slice();
  l=l.includes(k)?l.filter(x=>x!==k):l.concat(k); s[p]=l; A.sizes=s; saveDraft();
  refresh(`[data-size="${p}"][data-k="${k}"]`); return;
 }
 const st=e.target.closest("[data-step]");
 if(st){goStep(st.dataset.step);const g=st.dataset.goto;if(g)setTimeout(()=>document.getElementById("f-"+g)?.focus({preventScroll:false}),350);return}
 const act=e.target.closest("[data-act]"); if(!act)return;
 const a=act.dataset.act;
 const steps=vSteps(A), i=steps.findIndex(s=>s.id===cur);
 if(a==="next"){
  const miss=vQs(stepById(cur),A).filter(q=>q.req&&!answered(q,A));
  if(miss.length){miss.forEach(q=>{const box=document.querySelector(`.q[data-q="${q.id}"]`);if(box){box.classList.add("invalid");const er=box.querySelector(".err");if(er)er.hidden=false}});document.getElementById("f-"+miss[0].id)?.focus();return}
  goStep(i<steps.length-1?steps[i+1].id:"review");
 }
 else if(a==="back"){goStep(cur==="review"?steps[steps.length-1].id:steps[Math.max(0,i-1)].id)}
 else if(a==="pv"){pvOpen=!pvOpen;$("#pv").classList.toggle("open",pvOpen);act.setAttribute("aria-expanded",pvOpen)}
 else if(a==="fixMail"){A.contact=act.dataset.v;saveDraft();const f=$("#f-contact");if(f)f.value=A.contact;updateHelpers()}
 else if(a==="addExtra"){A.extra=arr(A.extra).concat({name:"",link:"",note:""});saveDraft();refresh("#f-xn-"+(A.extra.length-1),false)}
 else if(a==="rmExtra"){const l=arr(A.extra).slice();l.splice(+act.dataset.i,1);A.extra=l;saveDraft();refresh(null)}
 else if(a==="copy") copyText(briefText(A,lang),act);
 else if(a==="copyEmail") copyText(EMAIL,act);
 else if(a==="send") send(act);
 else if(a==="sendForm") sendForm(act);
 else if(a==="goMine"){tab="mine";justSent=false;renderTabs();render()}
 else if(a==="newOne"){justSent=false;cur="about";render();window.scrollTo(0,0)}
 else if(a==="refreshAll") loadAll();
 else if(a==="copyItem"){const item=act.closest(".item");const src=act.dataset.src==="all"?all:mine;const it=src.find(x=>x.id===item.dataset.id);if(it)copyText(briefText(it.data.answers||{},lang),act)}
 else if(a==="approve") decide(act.closest("[data-decide]").dataset.decide,"approved","");
 else if(a==="changes"){
  const row=act.closest("[data-decide]");
  row.innerHTML=`<div style="width:100%;display:flex;flex-direction:column;gap:8px"><textarea id="chg-${esc(row.dataset.decide)}" placeholder="${esc(t("changesPh"))}"></textarea><div class="row" style="margin:0"><button type="button" class="btn dark small" data-act="sendChanges">${t("sendChanges")}</button><button type="button" class="btn small" data-act="cancelChanges">${t("cancel")}</button></div></div>`;
  row.querySelector("textarea").focus();
 }
 else if(a==="cancelChanges") render();
 else if(a==="sendChanges"){const row=act.closest("[data-decide]");const note=row.querySelector("textarea").value.trim();if(!note){row.querySelector("textarea").focus();return}decide(row.dataset.decide,"changes",note)}
});
document.addEventListener("change",async e=>{
 const sel=e.target.closest("[data-status]"); if(!sel||!db)return;
 const item=sel.closest(".item"); const it=all.find(x=>x.id===item.dataset.id); if(!it)return;
 sel.disabled=true;
 try{await db.doc(`briefs/${it.owner}/items/${it.id}`).update({status:sel.value,updatedAt:new Date().toISOString()});it.data={...it.data,status:sel.value}}catch(err){sel.value=it.data.status}
 sel.disabled=false;
});

/* ---------- writes ---------- */
// Only answers to questions the client could see are sent; hidden branches are dropped.
function cleanAnswers(){
 const out={};
 vSteps(A).forEach(s=>vQs(s,A).forEach(q=>{
  if(!isEmpty(A[q.id]))out[q.id]=A[q.id];
  if(q.other&&arr(A[q.id]).includes("other")&&A[q.id+"_other"])out[q.id+"_other"]=A[q.id+"_other"];
  if(q.kind==="assets"){arr(A.assets).forEach(k=>{if(A["al_"+k])out["al_"+k]=A["al_"+k];if(A["an_"+k])out["an_"+k]=A["an_"+k]});const ex=arr(A.extra).filter(x=>x&&(x.name||x.link||x.note));if(ex.length)out.extra=ex}
 }));
 return out;
}
async function sendForm(btn){
 btn.disabled=true; btn.textContent=t("sending");
 const payload={access_key:FORM_KEY,subject:t("mailSubject")(A.title||""),from_name:lang==="ar"?"بريف الفيديو":"Video Brief"};
 const c=(A.contact||"").trim(); if(/^\S+@\S+\.\S+$/.test(c)) payload.replyto=c;
 payload[lang==="ar"?"لغة الطلب":"Request language"]=lang==="ar"?"عربي":"English";
 vSteps(A).forEach(s=>vQs(s,A).forEach(q=>{const v=valueText(q,A[q.id],lang,A);if(v)payload[L(s).t+" | "+QL(q)]=v}));
 try{
  const r=await fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload)});
  const j=await r.json().catch(()=>({}));
  if(r.ok&&(j.success===true||String(j.success)==="true")){
   lastSent={title:A.title||"",name:A.name||"",id:""}; sentMode="form";
   A={}; store.del(DRAFT); cur="about"; justSent=true; render(); window.scrollTo(0,0); return;
  }
  throw new Error(j.message||("HTTP "+r.status));
 }catch(e){
  console.warn("[brief] send failed:",e&&e.message);
  btn.disabled=false; btn.textContent=t("send");
  const box=$("#send-err"); if(box) box.innerHTML=`<div class="note warn" style="margin-top:14px;flex-direction:column;gap:10px"><span>${t("formErr")}</span>${emailBox()}<a class="btn go small" style="align-self:flex-start" href="${esc(mailBrief(A))}" target="_blank" rel="noopener">${t("waFull")}</a></div>`;
 }
}
async function send(btn){
 if(!db||!uid)return;
 btn.disabled=true; btn.textContent=t("sending");
 const now=new Date().toISOString();
 const answers=cleanAnswers();
 try{
  await db.doc(`briefs/${uid}`).set({name:answers.name||"",team:answers.company||"",lastAt:now});
  const newId="r"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  await db.collection(`briefs/${uid}/items`).doc(newId).set({createdAt:now,updatedAt:now,lang,status:"new",answers});
  lastSent={title:answers.title||"",name:answers.name||"",id:newId,ans:answers}; sentMode="";
  A={}; store.del(DRAFT); cur="about"; justSent=true; render(); window.scrollTo(0,0);
 }catch(err){
  btn.disabled=false; btn.textContent=t("send");
  const box=$("#send-err"); if(box) box.innerHTML=`<div class="note warn" style="margin-top:14px;flex-wrap:wrap"><span>${err&&err.code==="quota_exceeded"?t("quotaErr"):t("saveErr")}</span><a class="btn go small" href="${esc(mailBrief(A))}" target="_blank" rel="noopener">${t("waFull")}</a></div>`;
 }
}
async function decide(id,state,note){
 if(!db||!uid)return;
 const now=new Date().toISOString();
 try{await db.doc(`briefs/${uid}/items/${id}`).update({decision:{state,note,at:now},status:state==="approved"?"production":"changes",updatedAt:now})}
 catch(err){const row=document.querySelector(`[data-decide="${id}"]`);if(row)row.insertAdjacentHTML("afterend",`<div class="note warn" style="margin-top:8px">${t("saveErr")}</div>`)}
}

/* ---------- capabilities ---------- */
async function boot(){
 applyLang();
 if(!window.claude||typeof window.claude.use!=="function"){capReady=true;renderTabs();render();return}
 try{[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}catch(e){db=null;user=null}
 if(user){try{uid=await user.id()}catch(e){uid=null}try{isEditor=!!(await user.canEdit())}catch(e){isEditor=false}try{readOnly=(await user.can("data.write"))===false}catch(e){readOnly=false}}
 capReady=true;
 if(db&&uid){
  mineState="loading";
  mineTimer=setTimeout(()=>{if(mineState==="loading"){mineState="slow";if(tab==="mine")render()}},10000);
  db.collection(`briefs/${uid}/items`).orderBy("createdAt","desc").onSnapshot(snap=>{
   mine=snap.docs.map(d=>({id:d.id,data:d.data()}));
   if(!snap.metadata.fromCache){clearTimeout(mineTimer);mineState="ready"}else if(mineState==="loading")mineState="ready";
   renderTabs(); if(tab==="mine")render();
  },()=>{clearTimeout(mineTimer);mineState="slow";if(tab==="mine")render()});
 }
 if(isEditor&&db) loadAll();
 routeHash();
 renderTabs(); render();
}
function routeHash(){
 const h=(location.hash||"").slice(1);
 if(!h.startsWith("req-")) return;
 focusId=h.slice(4); justSent=false;
 tab=isEditor?"all":"mine";
 renderTabs(); render();
}
window.addEventListener("hashchange",routeHash);
boot();
})();
</script>
